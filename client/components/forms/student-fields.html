<!-- client/components/student-form-fields.html -->
<div>
  <x-forms.label for="student-name" required>Nome completo</x-forms.label>
  <x-forms.input
    id="student-name"
    type="text"
    x-model="form.name"
    :disabled="isLoading"
    placeholder="Insira o nome completo do aluno..."
    autofocus
  />
</div>

<div>
  <x-forms.label for="student-address">Endereço</x-forms.label>
  <x-forms.textarea
    id="student-address"
    x-model="form.address"
    :disabled="isLoading"
    placeholder="Rua, número, bairro..."
  />
</div>

<div class="grid grid-cols-2 gap-3">
  <div>
    <x-forms.label for="student-nationality">Nacionalidade</x-forms.label>
    <x-forms.input
      id="student-nationality"
      type="text"
      x-model="form.nationality"
      :disabled="isLoading"
    />
  </div>

  <div>
    <x-forms.label for="student-sex">Sexo</x-forms.label>
    <x-forms.select id="student-sex" x-model="form.sex" :disabled="isLoading">
      <option value="F">Feminino</option>
      <option value="M">Masculino</option>
    </x-forms.select>
  </div>
</div>

<div>
  <x-forms.label for="student-birth-date">Data de Nascimento</x-forms.label>
  <x-forms.input
    id="student-birth-date"
    type="date"
    x-model="form.birthDate"
    :disabled="isLoading"
  />
</div>

<!-- Campo status: visível apenas no formulário de edição (form.status existe).
     No cadastro, o status é sempre "ativo" e definido pelo servidor. -->
<template x-if="isEditMode">
  <div>
    <x-forms.label for="student-status">Status</x-forms.label>
    <x-forms.select
      id="student-status"
      x-model="form.status"
      :disabled="isLoading"
    >
      <option value="ativo">Ativo</option>
      <option value="inativo">Inativo</option>
      <option value="transferido">Transferido</option>
      <option value="formado">Formado</option>
      <option value="evadido">Evadido</option>
    </x-forms.select>
  </div>
</template>

<datalist id="relationshipList">
  <option value="Mãe"></option>
  <option value="Pai"></option>
  <option value="Tio"></option>
  <option value="Tia"></option>
  <option value="Outro"></option>
</datalist>

<x-separator></x-separator>

<div>
  <x-forms.label>Responsáveis</x-forms.label>

  <div class="mt-2 space-y-3">
    <template x-for="(guardian, index) in form.guardians" :key="index">
      <div class="space-y-3 rounded-md border border-slate-200 p-4">
        <!-- Header -->
        <div class="flex items-center justify-between">
          <label class="flex items-center gap-1.5 text-sm text-slate-600">
            <input
              type="radio"
              name="primaryGuardian"
              :checked="guardian.isPrimary"
              @change="setPrimaryGuardian(index)"
              :disabled="isLoading"
            />
            Responsável Principal
          </label>

          <button
            type="button"
            @click="removeGuardian(index)"
            :disabled="isLoading || form.guardians.length <= 1"
            class="shrink-0 rounded-md border border-slate-200 bg-white px-2 py-1.5 text-slate-500 transition-colors hover:bg-slate-50 hover:text-red-600 focus:outline-none disabled:cursor-not-allowed disabled:opacity-40"
          >
            <x-icons.close class="size-4"></x-icons.close>
            <span class="sr-only">Remover</span>
          </button>
        </div>

        <div>
          <x-forms.label for="guardian-name" required>
            Nome do Responsável
          </x-forms.label>
          <x-forms.input
            type="text"
            id="guardian-name"
            x-model="guardian.name"
            :disabled="isLoading"
            placeholder="Insira o nome completo do responsável..."
          />
        </div>

        <div class="grid grid-cols-2 gap-2">
          <div>
            <x-forms.label for="guardian-relationship" required>
              Parentesco
            </x-forms.label>
            <x-forms.input
              type="text"
              id="guardian-relationship"
              x-model="guardian.relationship"
              list="relationshipList"
              :disabled="isLoading"
              placeholder="Insira o parentesco..."
            />
          </div>

          <div>
            <x-forms.label for="guardian-phone">Telefone</x-forms.label>
            <x-forms.input
              type="tel"
              id="guardian-phone"
              x-model="guardian.phone"
              :disabled="isLoading"
              placeholder="Insira o telefone..."
            />
          </div>
        </div>

        <div>
          <x-forms.label for="guardian-address">
            Endereço (se diferente do aluno)
          </x-forms.label>
          <x-forms.textarea
            id="guardian-address"
            x-model="guardian.address"
            :disabled="isLoading"
            placeholder="Rua, número, bairro..."
          />
        </div>
      </div>
    </template>
  </div>

  <button
    type="button"
    @click="addGuardian()"
    :disabled="isLoading"
    class="mt-3 flex items-center gap-1.5 text-xs font-semibold text-slate-600 hover:text-slate-900 focus:outline-none disabled:opacity-50"
  >
    <x-icons.plus class="h-3 w-3"></x-icons.plus>
    Adicionar responsável
  </button>
</div>
