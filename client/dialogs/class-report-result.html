<!-- client/dialogs/class-report-result.html -->
<x-dialog-shell>
  <main
    data-init="<?= initData ?>"
    x-data="initDialog($el)"
    x-cloak
    class="flex h-full flex-col justify-between bg-slate-50 p-5 font-sans text-slate-800 antialiased"
  >
    <div class="space-y-3">
      <x-success-header>
        <p class="font-semibold text-emerald-900">
          <span x-text="successCount"></span> boletim(ns) gerado(s) com sucesso
        </p>

        <p class="text-emerald-700">
          Turma: <span x-text="className"></span> (
          <span x-text="schoolYearLabel"></span>)
        </p>
      </x-success-header>

      <!-- Aviso de interrupção por timeout -->
      <template x-if="interrupted">
        <div
          class="flex items-start space-x-3 rounded-md border border-amber-200 bg-amber-50 p-3"
        >
          <x-clock-icon></x-clock-icon>
          <div class="text-sm">
            <p class="font-semibold text-amber-900">
              Execução interrompida por tempo
            </p>
            <p class="text-amber-700" x-text="interruptedMessage"></p>
            <p class="mt-1 text-xs text-amber-700">
              Progresso: <span x-text="processedCount"></span> de
              <span x-text="totalStudents"></span> aluno(s).
            </p>
          </div>
        </div>
      </template>

      <!-- Erros de geração individual -->
      <template x-if="errors.length > 0">
        <div class="space-y-2 rounded-md border border-red-200 bg-red-50 p-3">
          <div class="flex items-center space-x-2 text-red-600">
            <x-circle-alert-icon></x-circle-alert-icon>
            <h2 class="text-sm font-semibold text-red-900">
              <span x-text="errors.length"></span> erro(s) na geração:
            </h2>
          </div>

          <ul
            class="max-h-35 divide-y divide-red-50 overflow-y-auto rounded border bg-white p-2 text-xs text-red-700"
          >
            <template x-for="(error, index) in errors" :key="index">
              <li
                class="list-none py-1 font-mono wrap-break-word text-red-600 first:pt-0 last:pb-0"
                x-text="error"
              ></li>
            </template>
          </ul>

          <template x-if="truncatedCount > 0">
            <p class="pt-1 text-xs text-red-500 italic">
              ... e mais <span x-text="truncatedCount"></span> erro(s) não
              exibido(s).
            </p>
          </template>
        </div>
      </template>

      <!-- Ações -->
      <div class="flex flex-col space-y-2 pt-1">
        <a
          :href="pdfFolderUrl"
          target="_blank"
          class="inline-flex w-full items-center justify-center rounded-md bg-blue-600 px-4 py-2 text-sm font-medium text-white shadow-sm transition-colors hover:bg-blue-700 focus:ring-2 focus:ring-blue-500 focus:ring-offset-2 focus:outline-none"
        >
          Abrir pasta no Drive
        </a>

        <template x-if="interrupted">
          <button
            @click="continueGeneration()"
            :disabled="isLoading"
            class="inline-flex w-full items-center justify-center rounded-md bg-amber-600 px-4 py-2 text-sm font-medium text-white shadow-sm transition-colors hover:bg-amber-700 focus:ring-2 focus:ring-amber-500 focus:ring-offset-2 focus:outline-none disabled:cursor-not-allowed disabled:opacity-70"
          >
            <span
              x-text="isLoading ? 'Continuando...' : 'Continuar geração'"
            ></span>
          </button>
        </template>

        <template x-if="interrupted">
          <button
            @click="cancelGeneration()"
            :disabled="isLoading"
            class="inline-flex w-full items-center justify-center rounded-md border border-red-200 bg-white px-4 py-2 text-sm font-medium text-red-700 transition-colors hover:bg-red-50 focus:ring-2 focus:ring-red-500 focus:ring-offset-2 focus:outline-none disabled:cursor-not-allowed disabled:opacity-70"
          >
            Cancelar geração pendente
          </button>
        </template>

        <x-error-alert></x-error-alert>
      </div>
    </div>

    <footer class="mt-5 border-t border-slate-200 pt-4">
      <x-close-button></x-close-button>
    </footer>
  </main>

  <!-- Scripts -->
  <script src="./class-report-result.ts"></script>
</x-dialog-shell>
