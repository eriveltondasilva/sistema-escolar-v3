<!-- client/dialogs/student-create.html -->
<x-dialog-shell>
  <form
    x-data="initDialog"
    x-cloak
    @submit.prevent="submit()"
    class="flex h-full flex-col gap-4"
  >
    <!-- Last student -->
    <div
      x-show="lastStudentId"
      x-transition
      class="flex shrink-0 items-center justify-between rounded-md border border-emerald-200 bg-emerald-50 px-3 py-2 text-xs"
    >
      <span class="text-emerald-700">
        Aluno cadastrado -
        <span
          class="font-mono font-semibold text-emerald-900"
          x-text="lastStudentId.padStart(4, '0')"
        ></span>
      </span>

      <div class="flex items-center gap-2">
        <button
          type="button"
          @click="editStudent()"
          :disabled="isOpeningEdit"
          class="cursor-pointer font-semibold text-emerald-700 hover:text-emerald-900 focus:outline-none disabled:opacity-50"
        >
          <span x-text="isOpeningEdit ? 'Abrindo...' : 'Ver aluno'"></span>
        </button>
        <button
          type="button"
          @click="lastStudentId = ''"
          class="text-emerald-500 hover:text-emerald-700 focus:outline-none"
        >
          <x-icons.close class="size-3"></x-icons.close>
        </button>
      </div>
    </div>

    <!-- Fields -->
    <div data-scroll class="flex-1 overflow-y-auto">
      <div class="flex flex-col gap-4">
        <x-forms.student-fields></x-forms.student-fields>

        <x-error-alert></x-error-alert>
      </div>
    </div>

    <!-- Actions -->
    <x-footers.actions class="shrink-0">
      <x-buttons.secondary
        onclick="google.script.host.close()"
        :disabled="isLoading"
      >
        <x-icons.close></x-icons.close>
        Cancelar
      </x-buttons.secondary>

      <x-buttons.primary type="submit" :disabled="isLoading">
        <x-icons.loader x-show="isLoading"></x-icons.loader>
        <x-icons.save x-show="!isLoading"></x-icons.save>
        <span x-text="isLoading ? 'Salvando...' : 'Cadastrar'"></span>
      </x-buttons.primary>
    </x-footers.actions>
  </form>

  <!-- Scripts -->
  <script src="./student-create.ts"></script>
</x-dialog-shell>
