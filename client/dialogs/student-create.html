<!-- client/dialogs/student-create.html -->
<x-dialog-shell>
  <main
    x-data="initDialog"
    x-cloak
    class="space-y-4 bg-white p-5 text-slate-900"
  >
    <div
      x-show="lastStudentId"
      x-transition
      class="flex items-center justify-between rounded-md border border-emerald-200 bg-emerald-50 px-3 py-2 text-xs"
    >
      <span class="text-emerald-700">
        Aluno cadastrado -
        <span
          class="font-mono font-semibold text-emerald-900"
          x-text="lastStudentId"
        ></span>
      </span>
      <div class="flex items-center gap-2">
        <button
          type="button"
          @click="editStudent()"
          :disabled="isOpeningEdit"
          class="cursor-pointer font-semibold text-emerald-700 hover:text-emerald-900 focus:outline-none disabled:opacity-50"
        >
          <span x-text="isOpeningEdit ? 'Abrindo...' : 'Ver aluno'"></span>
        </button>
        <button
          type="button"
          @click="lastStudentId = ''"
          class="text-emerald-500 hover:text-emerald-700 focus:outline-none"
        >
          <x-icons.close></x-icons.close>
        </button>
      </div>
    </div>

    <x-student-form-fields></x-student-form-fields>

    <x-footers.actions>
      <x-buttons.secondary :disabled="isLoading">Fechar</x-buttons.secondary>
      <x-buttons.primary @click="submit()" :disabled="isLoading">
        <span x-text="isLoading ? 'Salvando...' : 'Cadastrar'"></span>
      </x-buttons.primary>
    </x-footers.actions>
  </main>

  <script src="./student-create.ts"></script>
</x-dialog-shell>
