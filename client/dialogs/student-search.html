<!-- client/dialogs/student-search.html -->
<x-dialog-shell>
  <main x-data="initDialog" x-cloak class="space-y-4">
    <div class="flex gap-2">
      <div class="flex-1">
        <label
          for="query"
          class="mb-1 block text-xs font-medium tracking-wider text-slate-500 uppercase"
        >
          Nome ou Matrícula
        </label>
        <div class="relative">
          <input
            id="query"
            type="text"
            x-model="query"
            @input.debounce.300ms="search()"
            placeholder="Comece a digitar..."
            class="w-full rounded-md border border-slate-200 bg-white px-3 py-2 pr-8 text-sm shadow-sm transition-all focus:ring-1 focus:ring-slate-400 focus:outline-none"
          />
          <div
            x-show="isSearching"
            class="absolute top-1/2 right-2.5 -translate-y-1/2"
          >
            <div
              class="h-4 w-4 animate-spin rounded-full border-2 border-slate-200 border-t-slate-500"
            ></div>
          </div>
        </div>
      </div>

      <div class="w-36 shrink-0">
        <label
          for="status-filter"
          class="mb-1 block text-xs font-medium tracking-wider text-slate-500 uppercase"
        >
          Status
        </label>
        <select
          id="status-filter"
          x-model="status"
          @change="search()"
          class="w-full rounded-md border border-slate-200 bg-white px-3 py-2 text-sm shadow-sm transition-all focus:ring-1 focus:ring-slate-400 focus:outline-none"
        >
          <option value="ativo">Ativo</option>
          <option value="inativo">Inativo</option>
          <option value="transferido">Transferido</option>
          <option value="formado">Formado</option>
          <option value="evadido">Evadido</option>
        </select>
      </div>
    </div>

    <template
      x-if="!isSearching && query.trim() && results.length === 0 && !selectedStudent && !isLoadingDetails"
    >
      <p
        class="rounded-md border border-amber-200 bg-amber-50 p-2.5 text-xs font-medium text-amber-700"
      >
        Nenhum aluno encontrado.
      </p>
    </template>

    <template
      x-if="!selectedStudent && !isLoadingDetails && results.length > 0"
    >
      <ul
        class="max-h-48 divide-y divide-slate-100 overflow-y-auto rounded-md border"
      >
        <template x-for="result in results" :key="result.studentId">
          <li
            @click="selectStudent(result.studentId)"
            class="flex cursor-pointer items-center justify-between px-3 py-2.5 transition-colors hover:bg-slate-50"
          >
            <span
              class="text-sm font-medium text-slate-800"
              x-text="result.name"
            ></span>
            <span
              class="rounded bg-slate-100 px-1.5 py-0.5 font-mono text-xs text-slate-500"
              x-text="result.studentId"
            ></span>
          </li>
        </template>
      </ul>
    </template>

    <template x-if="isLoadingDetails">
      <div
        class="flex items-center justify-center gap-2 py-6 text-xs text-slate-400"
      >
        <div
          class="h-4 w-4 animate-spin rounded-full border-2 border-slate-200 border-t-slate-500"
        ></div>
        Carregando aluno...
      </div>
    </template>

    <template x-if="selectedStudent">
      <div class="space-y-3">
        <button
          type="button"
          @click="clearSelection()"
          class="flex items-center justify-center gap-2 text-xs font-semibold text-slate-400 hover:text-slate-700 focus:outline-none"
        >
          <x-icons.arrow-left></x-icons.arrow-left>
          Voltar à busca
        </button>

        <div
          class="space-y-3 rounded-md border border-slate-200 bg-slate-50 p-4"
        >
          <div>
            <p
              class="leading-tight font-semibold text-slate-900"
              x-text="selectedStudent.student.name"
            ></p>
            <p
              class="mt-0.5 font-mono text-xs text-slate-400"
              x-text="selectedStudent.student.studentId"
            ></p>
          </div>

          <div class="h-px bg-slate-200"></div>

          <dl class="grid grid-cols-2 gap-x-4 gap-y-2.5 text-xs">
            <div>
              <dt class="text-slate-400">Nascimento</dt>
              <dd
                class="font-medium text-slate-700"
                x-text="selectedStudent.student.birthDate || '—'"
              ></dd>
            </div>
            <div>
              <dt class="text-slate-400">Endereço</dt>
              <dd
                class="font-medium text-slate-700"
                x-text="selectedStudent.student.address || '—'"
              ></dd>
            </div>
            <div class="col-span-2">
              <dt class="text-slate-400">Responsáveis</dt>
              <dd
                class="font-medium text-slate-700"
                x-text="selectedStudent.guardianNamesFormatted"
              ></dd>
            </div>
          </dl>
        </div>

        <div>
          <p
            class="mb-1.5 text-xs font-medium tracking-wider text-slate-400 uppercase"
          >
            Boletins
          </p>

          <template x-if="selectedStudent.pdfHistory.length === 0">
            <p class="text-xs text-slate-400 italic">
              Nenhum boletim encontrado.
            </p>
          </template>

          <ul class="space-y-1">
            <template
              x-for="entry in selectedStudent.pdfHistory"
              :key="entry.pdfUrl"
            >
              <li>
                <a
                  :href="entry.pdfUrl"
                  target="_blank"
                  class="inline-flex items-center gap-1.5 text-xs font-semibold text-blue-600 hover:text-blue-800 focus:underline focus:outline-none"
                >
                  <x-icons.file></x-icons.file>
                  <span x-text="entry.yearLabel"></span>
                  <span class="text-slate-300">·</span>
                  <span x-text="entry.className"></span>
                </a>
              </li>
            </template>
          </ul>
        </div>

        <x-buttons.primary
          x-on:click="editStudent()"
          :disabled="isOpeningEdit"
          class="w-full gap-2"
        >
          <x-icons.square-pen></x-icons.square-pen>
          <span x-text="isOpeningEdit ? 'Abrindo...' : 'Editar aluno'"></span>
        </x-buttons.primary>
      </div>
    </template>

    <x-error-alert></x-error-alert>

    <x-footers.base>
      <x-buttons.secondary onclick="google.script.host.close()" class="w-full">
        <x-icons.close></x-icons.close>
        Fechar
      </x-buttons.secondary>
    </x-footers.base>
  </main>

  <script src="./student-search.ts"></script>
</x-dialog-shell>
