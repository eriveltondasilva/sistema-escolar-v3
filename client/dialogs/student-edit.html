<!-- client/dialogs/student-edit.html -->
<x-dialog-shell>
  <form
    data-init="<?= initData ?>"
    x-data="initDialog($el)"
    x-cloak
    @submit.prevent="submit()"
    class="flex h-full flex-col gap-4"
  >
    <!-- Skeleton -->
    <template x-if="isLoadingStudent">
      <div class="flex flex-1 flex-col gap-4">
        <!-- Fields skeleton -->
        <template x-for="i in [1,2,3,4,5]" :key="i">
          <div class="space-y-1.5">
            <div class="h-4 w-32 animate-pulse rounded bg-slate-100"></div>
            <div class="h-8 w-full animate-pulse rounded-md bg-slate-100"></div>
          </div>
        </template>
        <!-- Guardian skeleton -->
        <div class="space-y-1.5">
          <div class="h-4 w-32 animate-pulse rounded bg-slate-100"></div>
          <div class="h-8 w-full animate-pulse rounded-md bg-slate-100"></div>
          <div class="h-8 w-full animate-pulse rounded-md bg-slate-100"></div>
        </div>
      </div>
    </template>

    <!-- Form -->
    <template x-if="!isLoadingStudent">
      <div class="flex flex-1 flex-col gap-4">
        <div>
          <x-forms.label>Matrícula</x-forms.label>
          <x-forms.input
            type="text"
            :value="studentId.padStart(4, '0')"
            readonly
          />
        </div>

        <!-- Fields -->
        <x-forms.student-fields></x-forms.student-fields>

        <x-error-alert></x-error-alert>
      </div>
    </template>

    <!-- Actions: sempre visível, nunca se move -->
    <x-footers.actions class="shrink-0">
      <x-buttons.secondary
        onclick="google.script.host.close()"
        :disabled="isSaving"
      >
        <x-icons.close></x-icons.close>
        Cancelar
      </x-buttons.secondary>

      <x-buttons.primary type="submit" :disabled="isLoadingStudent || isSaving">
        <x-icons.loader x-show="isSaving"></x-icons.loader>
        <x-icons.save x-show="!isSaving"></x-icons.save>
        <span x-text="isSaving ? 'Salvando...' : 'Salvar'"></span>
      </x-buttons.primary>
    </x-footers.actions>
  </form>

  <!-- Scripts -->
  <script src="./student-edit.ts"></script>
</x-dialog-shell>
